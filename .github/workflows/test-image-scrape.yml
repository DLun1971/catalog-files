name: Test Image Scrape
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install node-fetch
      - name: Run scrape
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT: ${{ secrets.PAT }}
        run: node scripts/test-scrape.js
      - name: Reconcile images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT: ${{ secrets.PAT }}
        run: node scripts/reconcile.js
      - name: Commit images and part-images.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add images/ part-images.json
          git diff --staged --quiet || git commit -m "update images and part-images.json"
          git push
